<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offshore Market Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --accent: #00d4aa;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --green: #3fb950;
      --yellow: #d29922;
      --blue: #58a6ff;
      --orange: #f0883e;
      --red: #f85149;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.5;
    }
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 32px 40px;
    }
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.3px;
      line-height: 1.15;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--font-mono);
    }
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .header-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      flex-wrap: wrap;
    }
    .header-meta .value {
      color: var(--accent);
      font-weight: 500;
    }
    .nav-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .nav-link:hover { text-decoration: underline; }
    .nav-link.active {
      color: var(--text-muted);
      pointer-events: none;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(320px, 0.85fr) minmax(560px, 1.15fr);
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 1024px) {
      .hero { grid-template-columns: 1fr; }
    }
    .hero-copy, .panel, .sector-card, .news-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .hero-copy {
      padding: 24px;
      min-height: 268px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hero-copy h2 {
      font-size: 34px;
      line-height: 1.08;
      letter-spacing: -0.2px;
      margin-bottom: 14px;
    }
    .hero-copy p {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.75;
      max-width: 620px;
    }
    .sector-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 720px) {
      .sector-grid { grid-template-columns: 1fr; }
    }
    .sector-card {
      min-height: 128px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    .sector-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .sector-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .sector-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .sector-desc {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .metric {
      flex-shrink: 0;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
    }
    .sector-foot {
      color: var(--blue);
      font-size: 11px;
      font-weight: 600;
      margin-top: 14px;
    }
    .pulse-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) {
      .pulse-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .pulse-grid { grid-template-columns: 1fr; }
    }
    .pulse-item {
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .pulse-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
    }
    .pulse-item.blue::before { background: var(--blue); }
    .pulse-item.yellow::before { background: var(--yellow); }
    .pulse-item.orange::before { background: var(--orange); }
    .pulse-value {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
    }
    .pulse-note {
      color: var(--text-muted);
      font-size: 12px;
    }
    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin: 8px 0 12px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .section-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }
    .section-link:hover { text-decoration: underline; }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 980px) {
      .news-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .news-grid { grid-template-columns: 1fr; }
    }
    .news-card {
      padding: 16px 18px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .news-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
    }
    .category {
      color: #0d1117;
      background: var(--accent);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
    }
    .category.Earnings { background: var(--yellow); }
    .category.Fleet { background: var(--blue); }
    .category.MA { background: var(--orange); }
    .category.Outlook { background: var(--green); }
    .news-title {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 9px;
    }
    .news-summary {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .news-source {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      margin-top: 14px;
      display: inline-flex;
    }
    .news-source:hover { text-decoration: underline; }
    .loading {
      padding: 16px;
      color: var(--red);
      border: 1px solid rgba(248,81,73,0.35);
      background: rgba(248,81,73,0.06);
      border-radius: 8px;
    }
    /* Shared header alignment */
    .header {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(0, auto);
      align-items: start;
      gap: 12px 24px;
    }
    .header-right,
    .header-nav { justify-self: end; }
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .header { grid-template-columns: 1fr; }
      .header-right,
      .header-nav {
        justify-self: start;
        align-items: flex-start;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header-title">
      <h1>Offshore Market Intelligence</h1>
      <span class="subtitle">E&amp;P pipeline, deepwater drilling, floating production, financials and market news</span>
    </div>
    <div class="header-right">
      <nav class="header-nav">
        <span class="nav-link active">Overview</span>
        <a href="pipeline.html" class="nav-link">E&amp;P Pipeline</a>
        <a href="drilling.html" class="nav-link">Deepwater Drilling</a>
        <a href="fpso.html" class="nav-link">FPSO / FLNG Assets</a>
        <a href="earnings.html" class="nav-link">Drilling Financials</a>
        <a href="fpso_earnings.html" class="nav-link">FPSO / FLNG Financials</a>
        <a href="news.html" class="nav-link">Market News</a>
      </nav>
      <div class="header-meta" id="header-meta">
        <!-- populated by JS -->
      </div>
    </div>
  </header>

  <main id="app">
    <div class="loading">Loading offshore market data...</div>
  </main>
</div>

<script>
(async function () {
  const dataFiles = [
    './data/fleet.json',
    './data/pipeline.json',
    './data/fpso.json',
    './data/earnings.json',
    './data/fpso_earnings.json',
    './data/news.json',
  ];

  function esc(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function categoryClass(category) {
    if (category === 'M&A') return 'MA';
    return category || '';
  }

  function renderNews(items) {
    return items.slice(0, 6).map(item => `
      <article class="news-card">
        <div>
          <div class="news-meta">
            <span class="category ${esc(categoryClass(item.category))}">${esc(item.category)}</span>
            <span>${esc(item.date)}</span>
          </div>
          <div class="news-title">${esc(item.title)}</div>
          <div class="news-summary">${esc(item.summary)}</div>
        </div>
        <a class="news-source" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.source)} -></a>
      </article>
    `).join('');
  }

  try {
    const [fleet, pipeline, fpso, drillingEarnings, fpsoEarnings, news] = await Promise.all(
      dataFiles.map(url => fetch(url).then(r => {
        if (!r.ok) throw new Error(`${url} ${r.status}`);
        return r.json();
      }))
    );

    const deepwaterRigs = fleet.rigs.filter(r => r.type === 'Drillship' || r.type === 'Semisubmersible');
    const deepwaterOnContract = deepwaterRigs.filter(r => r.status === 'On Contract').length;
    const deepwaterIdleStacked = deepwaterRigs.filter(r => r.status === 'Idle' || r.status === 'Cold Stacked').length;
    const pipelineProjects = pipeline.projects || [];
    const pipelineCapex = pipelineProjects
      .filter(p => p.capex_busd != null)
      .reduce((sum, p) => sum + p.capex_busd, 0);
    const sortedNews = [...news.items].sort((a, b) => b.date.localeCompare(a.date));
    const drillingNews = sortedNews.filter(n => n.sector === 'Drilling').slice(0, 3);
    const fpsoNews = sortedNews.filter(n => n.sector === 'FPSO/FLNG').slice(0, 3);
    const latestNews = [
      drillingNews[0], fpsoNews[0],
      drillingNews[1], fpsoNews[1],
      drillingNews[2], fpsoNews[2],
    ].filter(Boolean);
    const latestUpdate = [
      fleet.updated,
      pipeline.updated,
      fpso.updated,
      drillingEarnings.updated,
      fpsoEarnings.updated,
      news.updated,
    ].filter(Boolean).sort().pop() || '—';

    document.getElementById('header-meta').innerHTML = `
      <span>Updated:</span>
      <span class="value">${esc(latestUpdate)}</span>
      <span>·</span>
      <span>${esc(news.update_frequency_ko || news.update_frequency || 'Weekly review + ad hoc updates')}</span>
    `;

    document.getElementById('app').innerHTML = `
      <section class="hero">
        <div class="hero-copy">
          <h2>Offshore Market Overview</h2>
          <p>
            Offshore drilling과 FPSO/FLNG 시장을 함께 보는 출발점입니다.
            E&amp;P 프로젝트/CAPEX, UDW·Deepwater rig, FPSO/FLNG 자산, 실적과 뉴스 흐름을 섹터별 대시보드로 연결합니다.
          </p>
        </div>
        <div class="sector-grid">
          <a class="sector-card" href="drilling.html">
            <div class="sector-top">
              <div>
                <div class="label">Sector</div>
                <div class="sector-title">UDW / Deepwater Rigs</div>
                <div class="sector-desc">Drillship and deepwater / harsh-environment semi-sub fleet status, utilization and dayrate trend.</div>
              </div>
              <div class="metric">${deepwaterRigs.length} rigs</div>
            </div>
            <div class="sector-foot">Open drilling dashboard</div>
          </a>
          <a class="sector-card" href="pipeline.html">
            <div class="sector-top">
              <div>
                <div class="label">Demand</div>
                <div class="sector-title">E&amp;P Pipeline</div>
                <div class="sector-desc">Major offshore projects, phase tracking and upstream CAPEX by operator.</div>
              </div>
              <div class="metric">${pipelineProjects.length} projects</div>
            </div>
            <div class="sector-foot">Open pipeline dashboard</div>
          </a>
          <a class="sector-card" href="fpso.html">
            <div class="sector-top">
              <div>
                <div class="label">Sector</div>
                <div class="sector-title">FPSO / FLNG Assets</div>
                <div class="sector-desc">Operating assets, orderbook, project pipeline and charter rates.</div>
              </div>
              <div class="metric">${fpso.vessels.length} assets</div>
            </div>
            <div class="sector-foot">Open asset dashboard</div>
          </a>
          <a class="sector-card" href="earnings.html">
            <div class="sector-top">
              <div>
                <div class="label">Financials</div>
                <div class="sector-title">Drilling Contractors</div>
                <div class="sector-desc">Contractor revenue, EBITDA margin, fleet mix and backlog.</div>
              </div>
              <div class="metric">${drillingEarnings.companies.length} cos</div>
            </div>
            <div class="sector-foot">Open drilling financials</div>
          </a>
          <a class="sector-card" href="fpso_earnings.html">
            <div class="sector-top">
              <div>
                <div class="label">Financials</div>
                <div class="sector-title">FPSO / FLNG Operators</div>
                <div class="sector-desc">Operator earnings, lease fleet, turnkey exposure and backlog.</div>
              </div>
              <div class="metric">${fpsoEarnings.companies.length} cos</div>
            </div>
            <div class="sector-foot">Open operator financials</div>
          </a>
        </div>
      </section>

      <section class="pulse-grid">
        <div class="pulse-item">
          <div class="label">Deepwater Fleet</div>
          <div class="pulse-value">${deepwaterRigs.length}</div>
          <div class="pulse-note">Deepwater focus · ${deepwaterOnContract} on contract · ${deepwaterIdleStacked} idle/stacked</div>
        </div>
        <div class="pulse-item blue">
          <div class="label">E&amp;P Pipeline</div>
          <div class="pulse-value">${pipelineProjects.length}</div>
          <div class="pulse-note">$${pipelineCapex.toFixed(1)}B tracked project CAPEX</div>
        </div>
        <div class="pulse-item blue">
          <div class="label">Production Assets</div>
          <div class="pulse-value">${fpso.vessels.length}</div>
          <div class="pulse-note">${fpso.orderbook.length} orderbook items tracked</div>
        </div>
        <div class="pulse-item yellow">
          <div class="label">Companies</div>
          <div class="pulse-value">${drillingEarnings.companies.length + fpsoEarnings.companies.length}</div>
          <div class="pulse-note">Drilling contractors + FPSO / FLNG operators</div>
        </div>
        <div class="pulse-item orange">
          <div class="label">News Flow</div>
          <div class="pulse-value">${news.items.length}</div>
          <div class="pulse-note">Latest offshore market items</div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <div class="section-title">Latest Market News</div>
          <a class="section-link" href="news.html">View all news</a>
        </div>
        <div class="news-grid">${renderNews(latestNews)}</div>
      </section>
    `;
  } catch (err) {
    document.getElementById('app').innerHTML =
      `<div class="loading">데이터 로드 실패: ${esc(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
