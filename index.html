<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODU Intelligence Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- Tabulator CDN -->
  <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>
  <style>
    /* ─── CSS Variables ─── */
    :root {
      --bg:         #0d1117;
      --panel:      #161b22;
      --border:     #30363d;
      --accent:     #00d4aa;
      --text:       #e6edf3;
      --text-muted: #8b949e;
      --green:      #3fb950;
      --red:        #f85149;
      --yellow:     #d29922;
      --blue:       #58a6ff;
      --orange:     #f0883e;
      --font-body:  'Inter', sans-serif;
      --font-mono:  'JetBrains Mono', monospace;
    }

    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ─── Layout ─── */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 32px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .header-title .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .header-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .header-meta .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .header-meta .meta-row .label {
      color: var(--text-muted);
    }
    .header-meta .meta-row .value {
      color: var(--accent);
      font-weight: 500;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ─── KPI Grid ─── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .kpi-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .kpi-card:hover { border-color: var(--accent); }
    .kpi-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 8px 0 0 8px;
    }
    .kpi-card.accent::before  { background: var(--accent); }
    .kpi-card.green::before   { background: var(--green); }
    .kpi-card.red::before     { background: var(--red); }
    .kpi-card.blue::before    { background: var(--blue); }

    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    .kpi-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 8px;
      font-family: var(--font-mono);
    }
    .kpi-value .unit {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 2px;
    }
    .kpi-delta {
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-mono);
    }
    .kpi-delta.positive { color: var(--green); }
    .kpi-delta.negative { color: var(--red); }
    .kpi-delta.neutral  { color: var(--text-muted); }

    /* ─── Filter Bar ─── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filter-bar .filter-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 4px;
    }
    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d1117;
      font-weight: 600;
    }

    /* ─── Two-column layout ─── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 1024px) {
      .two-col { grid-template-columns: 1fr; }
    }

    /* ─── Panel ─── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .panel-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .panel-body {
      padding: 16px;
    }
    .chart-container {
      position: relative;
      height: 280px;
    }

    /* ─── CAPEX section ─── */
    .capex-section {
      margin-bottom: 20px;
    }
    .capex-section .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }
    .capex-chart-container {
      position: relative;
      height: 260px;
    }

    /* ─── Newbuild section ─── */
    .newbuild-section {
      margin-bottom: 20px;
    }

    /* ─── Status Badges ─── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .badge-green   { background: rgba(63,185,80,0.15);  color: var(--green); }
    .badge-yellow  { background: rgba(210,153,34,0.15); color: var(--yellow); }
    .badge-red     { background: rgba(248,81,73,0.15);  color: var(--red); }
    .badge-blue    { background: rgba(88,166,255,0.15); color: var(--blue); }
    .badge-muted   { background: rgba(139,148,158,0.15); color: var(--text-muted); }

    /* ─── Loading / Error ─── */
    .loading {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 2;
    }
    .loading code {
      font-family: var(--font-mono);
      background: var(--border);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--accent);
    }

    /* ─── Tabulator Overrides ─── */
    .tabulator {
      background: transparent !important;
      border: none !important;
      font-family: var(--font-body) !important;
      font-size: 12px !important;
    }
    .tabulator .tabulator-header {
      background: rgba(48, 54, 61, 0.5) !important;
      border-bottom: 1px solid var(--border) !important;
    }
    .tabulator .tabulator-header .tabulator-col {
      background: transparent !important;
      border-right: 1px solid var(--border) !important;
      color: var(--text-muted) !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.5px !important;
    }
    .tabulator .tabulator-header .tabulator-col:last-child {
      border-right: none !important;
    }
    .tabulator .tabulator-row {
      background: transparent !important;
      border-bottom: 1px solid var(--border) !important;
      color: var(--text) !important;
    }
    .tabulator .tabulator-row:last-child {
      border-bottom: none !important;
    }
    .tabulator .tabulator-row:hover {
      background: rgba(48, 54, 61, 0.4) !important;
    }
    .tabulator .tabulator-row .tabulator-cell {
      border-right: 1px solid var(--border) !important;
      padding: 8px 10px !important;
    }
    .tabulator .tabulator-row .tabulator-cell:last-child {
      border-right: none !important;
    }
    .tabulator .tabulator-footer {
      background: transparent !important;
      border-top: 1px solid var(--border) !important;
      color: var(--text-muted) !important;
      font-size: 11px !important;
    }
    .tabulator .tabulator-paginator {
      color: var(--text-muted) !important;
    }
    .tabulator .tabulator-paginator button {
      background: transparent !important;
      border: 1px solid var(--border) !important;
      color: var(--text-muted) !important;
      border-radius: 4px !important;
    }
    .tabulator .tabulator-paginator button:hover {
      background: var(--border) !important;
      color: var(--text) !important;
    }
    .tabulator-tableholder {
      background: transparent !important;
    }
    .tabulator-placeholder {
      background: transparent !important;
      color: var(--text-muted) !important;
    }

    /* mono values */
    .mono {
      font-family: var(--font-mono);
      font-size: 11px;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <header class="header">
    <div class="header-title">
      <h1>MODU Intelligence Dashboard</h1>
      <span class="subtitle">Mobile Offshore Drilling Units — Global Market Overview</span>
    </div>
    <div class="header-meta" id="header-meta">
      <!-- populated by JS -->
    </div>
  </header>

  <!-- KPI Grid -->
  <section class="kpi-grid" id="kpi-grid">
    <!-- populated by JS -->
  </section>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <span class="filter-label">RIG TYPE</span>
    <button class="filter-btn active" data-filter="All">All</button>
    <button class="filter-btn" data-filter="Drillship">Drillship</button>
    <button class="filter-btn" data-filter="Semisubmersible">Semisubmersible</button>
    <button class="filter-btn" data-filter="Jack-up">Jack-up</button>
  </div>

  <!-- Two-column: Fleet Table | Day Rate Chart -->
  <div class="two-col">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title"><span class="dot"></span>Fleet Status</span>
        <span class="panel-subtitle" id="fleet-count">— rigs</span>
      </div>
      <div id="fleet-table"></div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title"><span class="dot" style="background:var(--blue)"></span>Day Rate Trend</span>
        <span class="panel-subtitle">k$/day · quarterly</span>
      </div>
      <div class="panel-body">
        <div class="chart-container">
          <canvas id="dayRateChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- CAPEX Section -->
  <div class="capex-section">
    <div class="section-label">CAPEX Guidance</div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title"><span class="dot" style="background:var(--orange)"></span>Annual CAPEX by Company</span>
          <span class="panel-subtitle">$B USD</span>
        </div>
        <div class="panel-body">
          <div class="capex-chart-container">
            <canvas id="capexChart"></canvas>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title"><span class="dot" style="background:var(--yellow)"></span>CAPEX Summary</span>
          <span class="panel-subtitle">Latest year per company</span>
        </div>
        <div id="capex-table"></div>
      </div>
    </div>
  </div>

  <!-- Newbuild Prices Table -->
  <div class="newbuild-section">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title"><span class="dot" style="background:var(--yellow)"></span>Newbuild &amp; Repair Prices</span>
        <span class="panel-subtitle">Yard contract data</span>
      </div>
      <div id="newbuild-table"></div>
    </div>
  </div>

</div>

<script>
(async function () {
  /* ─────────────────────────────────────────
     Data loading
  ───────────────────────────────────────── */
  let fleet, rates, capex;
  let dayRateChart = null;
  let capexChart = null;
  let capexTable = null;
  let newbuildTable = null;

  function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  try {
    [fleet, rates, capex] = await Promise.all([
      fetch('./data/fleet.json').then(r => r.json()),
      fetch('./data/rates.json').then(r => r.json()),
      fetch('./data/capex.json').then(r => r.json()),
    ]);
  } catch (err) {
    document.querySelector('.container').innerHTML +=
      `<div class="loading">⚠ 데이터 로드 실패: ${err.message}<br>로컬 서버로 실행하세요: <code>python3 -m http.server 8080</code></div>`;
    return;
  }

  /* ─────────────────────────────────────────
     Render Header Meta
  ───────────────────────────────────────── */
  function renderHeader() {
    const el = document.getElementById('header-meta');
    el.innerHTML = `
      <div class="meta-row">
        <span class="live-dot"></span>
        <span class="label">Fleet data:</span>
        <span class="value">${esc(fleet.updated)}</span>
      </div>
      <div class="meta-row">
        <span class="label">Day rates:</span>
        <span class="value">${esc(rates.updated)}</span>
      </div>
      <div class="meta-row">
        <span class="label">CAPEX:</span>
        <span class="value">${esc(capex.updated)}</span>
      </div>
    `;
  }

  /* ─────────────────────────────────────────
     KPI Logic
  ───────────────────────────────────────── */
  function calcKPIs(rigs) {
    const total = rigs.length;
    const onContract = rigs.filter(r => r.status === 'On Contract').length;
    const idleStacked = rigs.filter(r => r.status === 'Idle' || r.status === 'Cold Stacked').length;
    return { total, onContract, idleStacked };
  }

  function getAvgDayRate() {
    const drillshipUDW = rates.day_rates
      .filter(r => r.rig_type === 'Drillship' && r.tier === 'Ultra-deepwater')
      .sort((a, b) => b.date.localeCompare(a.date));
    return drillshipUDW.length ? drillshipUDW[0].rate_kusd : null;
  }

  function deltaText(current, prev) {
    if (prev == null) return { text: '—', cls: 'neutral' };
    const diff = current - prev;
    if (diff > 0) return { text: `▲ ${diff}`, cls: 'positive' };
    if (diff < 0) return { text: `▼ ${Math.abs(diff)}`, cls: 'negative' };
    return { text: '—', cls: 'neutral' };
  }

  /* ─────────────────────────────────────────
     Render KPI Cards
  ───────────────────────────────────────── */
  function renderKPIs(rigs, isFiltered) {
    const { total, onContract, idleStacked } = calcKPIs(rigs);
    const avgRate = getAvgDayRate();

    const pw = fleet.prev_week;
    const totalDelta   = isFiltered ? { text: '—', cls: 'neutral' } : deltaText(total, pw.total);
    const contractDelta = isFiltered ? { text: '—', cls: 'neutral' } : deltaText(onContract, pw.on_contract);
    const idleDelta    = isFiltered ? { text: '—', cls: 'neutral' } : deltaText(idleStacked, pw.idle_stacked);

    document.getElementById('kpi-grid').innerHTML = `
      <div class="kpi-card accent">
        <div class="kpi-label">Total Rigs</div>
        <div class="kpi-value">${total}</div>
        <div class="kpi-delta ${totalDelta.cls}">${totalDelta.text} vs prev week</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">On Contract</div>
        <div class="kpi-value">${onContract}</div>
        <div class="kpi-delta ${contractDelta.cls}">${contractDelta.text} vs prev week</div>
      </div>
      <div class="kpi-card red">
        <div class="kpi-label">Idle + Stacked</div>
        <div class="kpi-value">${idleStacked}</div>
        <div class="kpi-delta ${idleDelta.cls}">${idleDelta.text} vs prev week</div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-label">Avg Day Rate (UDW Drillship)</div>
        <div class="kpi-value">${avgRate !== null ? avgRate : '—'}<span class="unit">k$/day</span></div>
        <div class="kpi-delta neutral">Global · not filtered</div>
      </div>
    `;
  }

  /* ─────────────────────────────────────────
     Status Badge helper
  ───────────────────────────────────────── */
  function statusBadge(status) {
    if (!status) return '<span class="badge badge-muted">—</span>';
    const map = {
      'On Contract':         'badge-green',
      'Idle':                'badge-yellow',
      'Cold Stacked':        'badge-red',
      'Under Construction':  'badge-blue',
      'Shipyard':            'badge-muted',
    };
    const cls = map[status] || 'badge-muted';
    return `<span class="badge ${cls}">${status}</span>`;
  }

  /* ─────────────────────────────────────────
     Fleet Table (Tabulator)
  ───────────────────────────────────────── */
  let fleetTable = null;

  function renderFleetTable(rigs) {
    const tableData = rigs.map(r => ({
      name: r.name,
      type: r.type,
      status: r.status,
      operator: r.operator,
      contract_end: r.contract_end,
      day_rate_kusd: r.day_rate_kusd,
    }));

    if (fleetTable) {
      fleetTable.setData(tableData);
      return;
    }

    fleetTable = new Tabulator('#fleet-table', {
      data: tableData,
      height: '320px',
      layout: 'fitColumns',
      responsiveLayout: false,
      columns: [
        {
          title: 'Rig Name',
          field: 'name',
          widthGrow: 2,
          formatter: cell => `<span style="font-weight:500;color:var(--text)">${esc(cell.getValue())}</span>`,
        },
        {
          title: 'Type',
          field: 'type',
          widthGrow: 1,
          formatter: cell => `<span class="mono" style="color:var(--text-muted)">${esc(cell.getValue())}</span>`,
        },
        {
          title: 'Status',
          field: 'status',
          widthGrow: 1.2,
          formatter: cell => statusBadge(cell.getValue()),
        },
        {
          title: 'Operator',
          field: 'operator',
          widthGrow: 1,
          formatter: cell => {
            const v = cell.getValue();
            return v ? `<span style="color:var(--text)">${esc(v)}</span>` : '<span style="color:var(--text-muted)">—</span>';
          },
        },
        {
          title: 'Contract End',
          field: 'contract_end',
          widthGrow: 1,
          formatter: cell => {
            const v = cell.getValue();
            return v ? `<span class="mono" style="color:var(--text-muted)">${v}</span>` : '<span style="color:var(--text-muted)">—</span>';
          },
        },
        {
          title: 'Rate (k$)',
          field: 'day_rate_kusd',
          widthGrow: 0.8,
          hozAlign: 'right',
          formatter: cell => {
            const v = cell.getValue();
            return v !== null && v !== undefined
              ? `<span class="mono" style="color:var(--accent)">${v}</span>`
              : '<span style="color:var(--text-muted)">—</span>';
          },
        },
      ],
    });
  }

  /* ─────────────────────────────────────────
     Day Rate Chart (Chart.js)
  ───────────────────────────────────────── */
  function renderDayRateChart() {
    const allDates = [...new Set(rates.day_rates.map(r => r.date))].sort();

    function buildDataset(rigType, tier) {
      const entries = rates.day_rates.filter(r => r.rig_type === rigType && r.tier === tier);
      return allDates.map(date => {
        const found = entries.find(e => e.date === date);
        return found ? found.rate_kusd : null;
      });
    }

    const ctx = document.getElementById('dayRateChart').getContext('2d');
    if (dayRateChart) { dayRateChart.destroy(); }

    function makeGradient(ctx, colorHex) {
      const grad = ctx.createLinearGradient(0, 0, 0, 280);
      grad.addColorStop(0, colorHex + '55');
      grad.addColorStop(1, colorHex + '00');
      return grad;
    }

    dayRateChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: allDates,
        datasets: [
          {
            label: 'Drillship (UDW)',
            data: buildDataset('Drillship', 'Ultra-deepwater'),
            borderColor: '#00d4aa',
            backgroundColor: makeGradient(ctx, '#00d4aa'),
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#00d4aa',
            spanGaps: true,
          },
          {
            label: 'Semisubmersible',
            data: buildDataset('Semisubmersible', 'Deepwater'),
            borderColor: '#58a6ff',
            backgroundColor: makeGradient(ctx, '#58a6ff'),
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#58a6ff',
            spanGaps: true,
          },
          {
            label: 'Jack-up',
            data: buildDataset('Jack-up', 'Premium'),
            borderColor: '#f0883e',
            backgroundColor: makeGradient(ctx, '#f0883e'),
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#f0883e',
            spanGaps: true,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: {
              color: '#8b949e',
              font: { size: 11, family: "'Inter', sans-serif" },
              boxWidth: 12,
              padding: 16,
            },
          },
          tooltip: {
            backgroundColor: '#161b22',
            borderColor: '#30363d',
            borderWidth: 1,
            titleColor: '#e6edf3',
            bodyColor: '#8b949e',
            padding: 10,
            callbacks: {
              label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y} k$/day`,
            },
          },
        },
        scales: {
          x: {
            grid: { color: '#30363d33', drawBorder: false },
            ticks: { color: '#8b949e', font: { size: 10, family: "'JetBrains Mono', monospace" } },
          },
          y: {
            grid: { color: '#30363d55', drawBorder: false },
            ticks: {
              color: '#8b949e',
              font: { size: 10, family: "'JetBrains Mono', monospace" },
              callback: v => v + 'k',
            },
          },
        },
      },
    });
  }

  /* ─────────────────────────────────────────
     CAPEX Bar Chart (Chart.js)
  ───────────────────────────────────────── */
  function renderCapexChart() {
    const palette = ['#00d4aa','#58a6ff','#f0883e','#d29922','#bc8cff','#f85149','#3fb950','#79c0ff','#ffa657'];

    // Collect all years
    const allYears = new Set();
    capex.companies.forEach(c => c.capex_guidance.forEach(g => allYears.add(g.year)));
    const years = [...allYears].sort();

    const datasets = capex.companies.map((company, i) => {
      const data = years.map(year => {
        const entry = company.capex_guidance.find(g => g.year === year);
        return entry ? entry.amount_busd : null;
      });
      return {
        label: company.name,
        data,
        backgroundColor: palette[i % palette.length] + 'cc',
        borderColor: palette[i % palette.length],
        borderWidth: 1,
        borderRadius: 3,
        spanGaps: true,
      };
    });

    const ctx = document.getElementById('capexChart').getContext('2d');
    if (capexChart) { capexChart.destroy(); }
    capexChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: years, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: {
              color: '#8b949e',
              font: { size: 10, family: "'Inter', sans-serif" },
              boxWidth: 10,
              padding: 10,
            },
          },
          tooltip: {
            backgroundColor: '#161b22',
            borderColor: '#30363d',
            borderWidth: 1,
            titleColor: '#e6edf3',
            bodyColor: '#8b949e',
            padding: 10,
            callbacks: {
              label: ctx => ` ${ctx.dataset.label}: $${ctx.parsed.y}B`,
            },
          },
        },
        scales: {
          x: {
            grid: { color: '#30363d33', drawBorder: false },
            ticks: { color: '#8b949e', font: { size: 11 } },
          },
          y: {
            grid: { color: '#30363d55', drawBorder: false },
            ticks: {
              color: '#8b949e',
              font: { size: 10, family: "'JetBrains Mono', monospace" },
              callback: v => '$' + v + 'B',
            },
          },
        },
      },
    });
  }

  /* ─────────────────────────────────────────
     CAPEX Summary Table (Tabulator)
  ───────────────────────────────────────── */
  function renderCapexTable() {
    const tableData = capex.companies.map(c => {
      if (!c.capex_guidance.length) return null;
      // Get latest year entry
      const latest = c.capex_guidance.slice().sort((a, b) => b.year - a.year)[0];
      return {
        company: c.name,
        type: c.type,
        year: latest.year,
        amount_busd: latest.amount_busd,
        focus: c.upstream_focus,
      };
    }).filter(Boolean);

    if (capexTable) { capexTable.destroy(); }
    capexTable = new Tabulator('#capex-table', {
      data: tableData,
      height: '280px',
      layout: 'fitColumns',
      columns: [
        {
          title: 'Company',
          field: 'company',
          widthGrow: 1.2,
          formatter: cell => `<span style="font-weight:500;color:var(--text)">${esc(cell.getValue())}</span>`,
        },
        {
          title: 'Type',
          field: 'type',
          widthGrow: 0.8,
          formatter: cell => {
            const v = cell.getValue();
            const cls = v === 'NOC' ? 'badge-blue' : 'badge-muted';
            return `<span class="badge ${cls}">${v}</span>`;
          },
        },
        {
          title: 'Year',
          field: 'year',
          widthGrow: 0.5,
          hozAlign: 'center',
          formatter: cell => `<span class="mono" style="color:var(--text-muted)">${cell.getValue()}</span>`,
        },
        {
          title: 'CAPEX ($B)',
          field: 'amount_busd',
          widthGrow: 0.7,
          hozAlign: 'right',
          formatter: cell => `<span class="mono" style="color:var(--accent)">$${cell.getValue()}B</span>`,
        },
        {
          title: 'Focus',
          field: 'focus',
          widthGrow: 2,
          formatter: cell => `<span style="color:var(--text-muted);font-size:11px">${esc(cell.getValue())}</span>`,
        },
      ],
    });
  }

  /* ─────────────────────────────────────────
     Newbuild Prices Table (Tabulator)
  ───────────────────────────────────────── */
  function renderNewbuildTable() {
    const tableData = rates.newbuild_prices.map(p => ({
      date: p.date,
      rig_type: p.rig_type,
      yard: p.yard,
      price_musd: p.price_musd,
      notes: p.notes,
    }));

    if (newbuildTable) { newbuildTable.destroy(); }
    newbuildTable = new Tabulator('#newbuild-table', {
      data: tableData,
      layout: 'fitColumns',
      columns: [
        {
          title: 'Date',
          field: 'date',
          widthGrow: 0.6,
          formatter: cell => `<span class="mono" style="color:var(--text-muted)">${cell.getValue()}</span>`,
        },
        {
          title: 'Rig Type',
          field: 'rig_type',
          widthGrow: 1.2,
          formatter: cell => `<span style="color:var(--text)">${cell.getValue()}</span>`,
        },
        {
          title: 'Yard',
          field: 'yard',
          widthGrow: 1,
          formatter: cell => `<span style="color:var(--blue)">${esc(cell.getValue())}</span>`,
        },
        {
          title: 'Price ($M)',
          field: 'price_musd',
          widthGrow: 0.7,
          hozAlign: 'right',
          formatter: cell => `<span class="mono" style="color:var(--accent)">$${cell.getValue()}M</span>`,
        },
        {
          title: 'Notes',
          field: 'notes',
          widthGrow: 2,
          formatter: cell => `<span style="color:var(--text-muted);font-size:11px">${esc(cell.getValue())}</span>`,
        },
      ],
    });
  }

  /* ─────────────────────────────────────────
     Filter Logic
  ───────────────────────────────────────── */
  let currentFilter = 'All';

  function applyFilter(filter) {
    currentFilter = filter;
    const filtered = filter === 'All'
      ? fleet.rigs
      : fleet.rigs.filter(r => r.type === filter);

    renderKPIs(filtered, filter !== 'All');
    renderFleetTable(filtered);
    document.getElementById('fleet-count').textContent = `${filtered.length} rigs`;
  }

  function initFilters() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(btn.dataset.filter);
      });
    });
  }

  /* ─────────────────────────────────────────
     Main Init
  ───────────────────────────────────────── */
  renderHeader();
  renderKPIs(fleet.rigs, false);
  renderFleetTable(fleet.rigs);
  renderDayRateChart();
  renderCapexChart();
  renderCapexTable();
  renderNewbuildTable();
  initFilters();

})();
</script>
</body>
</html>
