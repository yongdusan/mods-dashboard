name: Data Refresh (Claude, cloud)

# GitHub 클라우드에서 Claude Code를 실행해 데이터 파일을 갱신한다. 데스크톱 앱과 무관하게 실행됨.
# Claude는 data/ 파일 조사·편집만 하고, 검증(check_data.py)·커밋·push는 이 워크플로가 한다.
# 비용: 공개 저장소라 Actions 실행 시간 무료, Claude는 구독 토큰(CLAUDE_CODE_OAUTH_TOKEN) 사용 → 추가 과금 없음.
# API 키(ANTHROPIC_API_KEY)는 쓰지 않는다.
# Claude 단계가 실패하면(일시적 즉시 실패 — 0.4초 만에 is_error:true, setup-bun HTTP 504 등) 4분 뒤 data/를 원상복구하고 1회 재시도한다.
# 두 번 다 실패하면 마지막 단계에서 잡을 실패 처리한다. 커밋은 여전히 check_data.py ERROR 0일 때만.
# 실적 시즌(1·2·4·5·7·8·10·11월)에는 매주 수 12:00 KST에 earnings를 추가 실행한다(분기 실적이 몰려 나오는 시기).
on:
  schedule:
    - cron: '0 0 * * 1'       # news           — 매주 월 09:00 KST
    - cron: '30 1 * * 1'      # fleet          — 매주 월 10:30 KST
    - cron: '0 1 1,16 * *'    # earnings       — 매월 1·16일 10:00 KST
    - cron: '0 3 * 1,2,4,5,7,8,10,11 3'  # earnings (실적 시즌) — 1·2·4·5·7·8·10·11월 매주 수 12:00 KST
    - cron: '0 0 10 * *'      # pipeline_fpso  — 매월 10일 09:00 KST
  workflow_dispatch:
    inputs:
      task:
        description: 'Which refresh to run'
        type: choice
        options: [news, fleet, earnings, pipeline_fpso, smoke]
        default: smoke

concurrency:
  group: data-refresh          # 한 번에 하나씩 — 같은 파일 동시 수정 방지
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 시도 2회 + 대기 4분
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require subscription token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set — refusing to run (no API-key fallback)."
            exit 1
          fi
          # copy/paste often adds a newline; strip whitespace, keep the value masked, never print it
          CLEAN=$(printf '%s' "$TOKEN" | tr -d ' \t\r\n')
          echo "::add-mask::$CLEAN"
          case "$CLEAN" in sk-ant-oat*) ;; *) echo "::error::CLAUDE_CODE_OAUTH_TOKEN does not look like a subscription token."; exit 1 ;; esac
          echo "token ok (length ${#CLEAN})"
          echo "CLAUDE_TOKEN_CLEAN=$CLEAN" >> "$GITHUB_ENV"

      - name: Install collector dependency
        run: pip install requests

      - name: Pick task
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '0 0 * * 1')    TASK=news ;;
            '30 1 * * 1')   TASK=fleet ;;
            '0 1 1,16 * *') TASK=earnings ;;
            '0 3 * 1,2,4,5,7,8,10,11 3') TASK=earnings ;;
            '0 0 10 * *')   TASK=pipeline_fpso ;;
            *)              TASK="${{ inputs.task }}" ;;
          esac
          case "$TASK" in
            news)          FILES="data/news.json" ;;
            fleet)         FILES="data/fleet.json" ;;
            earnings)      FILES="data/earnings.json data/fpso_earnings.json data/rates.json data/capex.json" ;;
            pipeline_fpso) FILES="data/pipeline.json data/fpso.json data/news.json" ;;
            smoke)         FILES="" ;;
            *) echo "unknown task $TASK"; exit 1 ;;
          esac
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          {
            echo 'prompt<<__PROMPT__'
            cat "automation/prompts/$TASK.md"
            echo
            echo "TODAY=$(TZ=Asia/Seoul date +%F)"
            echo '__PROMPT__'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        id: claude
        continue-on-error: true   # 실패해도 아래에서 1회 재시도, 최종 판정은 마지막 단계에서
        uses: anthropics/claude-code-action@v1
        env:
          TODAY: ${{ steps.pick.outputs.today }}
        with:
          # Claude 구독(Pro/Max) 토큰으로 실행 — API 과금 없음. `claude setup-token`으로 발급해 저장소 시크릿에 등록.
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN_CLEAN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.pick.outputs.prompt }}
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 150
            --allowedTools "Read,Edit,Write,WebSearch,WebFetch,Bash(python3 scripts/check_data.py*),Bash(python3 scripts/refresh_news.py*),Bash(python3 scripts/audit_queue.py*),Bash(python3 -m json.tool *),Bash(git status*),Bash(git diff*)"

      - name: Wait and reset before retry
        if: steps.claude.outcome == 'failure'
        run: |
          echo "::warning::Claude attempt 1 failed — resetting data/ and retrying in 4 minutes."
          git checkout -- data/    # 1차 시도가 남긴 부분 편집 제거 (재시도는 깨끗한 상태에서)
          git clean -fdq data/
          sleep 240

      - name: Run Claude (retry)
        id: claude_retry
        if: steps.claude.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          TODAY: ${{ steps.pick.outputs.today }}
        with:
          # Claude 구독(Pro/Max) 토큰으로 실행 — API 과금 없음. `claude setup-token`으로 발급해 저장소 시크릿에 등록.
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN_CLEAN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.pick.outputs.prompt }}
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 150
            --allowedTools "Read,Edit,Write,WebSearch,WebFetch,Bash(python3 scripts/check_data.py*),Bash(python3 scripts/refresh_news.py*),Bash(python3 scripts/audit_queue.py*),Bash(python3 -m json.tool *),Bash(git status*),Bash(git diff*)"

      - name: Validate
        id: validate
        if: steps.pick.outputs.files != '' && (steps.claude.outcome == 'success' || steps.claude_retry.outcome == 'success')
        run: |
          set +e
          python scripts/check_data.py --markdown > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push (only this task's files, only if valid)
        if: steps.pick.outputs.files != '' && (steps.claude.outcome == 'success' || steps.claude_retry.outcome == 'success') && steps.validate.outputs.status == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.pick.outputs.files }}
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: cloud ${{ steps.pick.outputs.task }} refresh ${{ steps.pick.outputs.today }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      - name: Report invalid result
        if: steps.pick.outputs.files != '' && (steps.claude.outcome == 'success' || steps.claude_retry.outcome == 'success') && steps.validate.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff -- data/ > rejected.diff || true
          gh label create data-health --color D93F0B --description "Automated data health check" 2>/dev/null || true
          gh issue create --label data-health \
            --title "Cloud ${{ steps.pick.outputs.task }} refresh rejected (${{ steps.pick.outputs.today }})" \
            --body "check_data.py found errors, so nothing was committed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          $(cat report.md)"
          exit 1

      - name: Fail if Claude did not complete
        if: steps.claude.outcome != 'success' && steps.claude_retry.outcome != 'success'
        run: |
          echo "::error::Claude failed on both attempts (attempt 1: ${{ steps.claude.outcome }}, retry: ${{ steps.claude_retry.outcome }}) — nothing was committed."
          exit 1
