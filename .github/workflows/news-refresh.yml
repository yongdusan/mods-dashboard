name: News Refresh

on:
  schedule:
    - cron: '0 0 * * 1'  # 매주 월요일 09:00 KST (00:00 UTC)
  workflow_dispatch:       # GitHub Actions UI에서 수동 실행 가능

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Update news.json via Claude Haiku
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run news refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/refresh_news.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: auto-refresh news.json $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
