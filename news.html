<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market News — Offshore Market Intelligence</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── CSS Variables ─── */
    :root {
      --bg:         #0d1117;
      --panel:      #161b22;
      --border:     #30363d;
      --accent:     #00d4aa;
      --text:       #e6edf3;
      --text-muted: #8b949e;
      --green:      #3fb950;
      --red:        #f85149;
      --yellow:     #d29922;
      --blue:       #58a6ff;
      --orange:     #f0883e;
      --font-body:  'Inter', sans-serif;
      --font-mono:  'JetBrains Mono', monospace;
    }

    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ─── Layout ─── */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 32px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .header-title .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .header-nav {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .nav-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .nav-link:hover { text-decoration: underline; }
    .nav-link.active {
      color: var(--text-muted);
      pointer-events: none;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .header-meta .value { color: var(--accent); font-weight: 500; }
    .header-meta .frequency {
      color: var(--text-muted);
      max-width: 520px;
      text-align: right;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ─── Controls Bar ─── */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d1117;
      font-weight: 600;
    }
    .filter-btn .count {
      opacity: 0.75;
      font-weight: 400;
    }

    .search-input {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      font-family: var(--font-body);
      width: 240px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--accent); }

    /* ─── News Grid ─── */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1100px) { .news-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 680px)  { .news-grid { grid-template-columns: 1fr; } }

    /* ─── News Card ─── */
    .news-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .news-card:hover {
      border-color: rgba(0, 212, 170, 0.4);
      box-shadow: 0 2px 12px rgba(0, 212, 170, 0.06);
    }

    /* Card top row: badge + date */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-date {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    /* Category badge */
    .cat-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .cat-Contract { background: rgba(63,185,80,0.15);  color: #3fb950; }
    .cat-MA       { background: rgba(88,166,255,0.15); color: #58a6ff; }
    .cat-Earnings { background: rgba(210,153,34,0.15); color: #d29922; }
    .cat-Fleet    { background: rgba(240,136,62,0.15); color: #f0883e; }
    .cat-Project  { background: rgba(163,113,247,0.15); color: #a371f7; }
    .cat-Outlook  { background: rgba(0,212,170,0.15);  color: #00d4aa; }
    .sector-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(139,148,158,0.35);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .sector-FPSOFLNG {
      border-color: rgba(88,166,255,0.35);
      color: var(--blue);
      background: rgba(88,166,255,0.08);
    }
    .sector-Drilling {
      border-color: rgba(0,212,170,0.35);
      color: var(--accent);
      background: rgba(0,212,170,0.08);
    }
    .sector-EPCAPEX {
      border-color: rgba(210,153,34,0.38);
      color: var(--yellow);
      background: rgba(210,153,34,0.08);
    }

    /* Title */
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    /* Summary */
    .card-summary {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
    }
    .card-summary.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Expand toggle */
    .card-toggle {
      font-size: 11px;
      color: var(--accent);
      font-family: var(--font-mono);
      opacity: 0.8;
      margin-top: -4px;
    }

    /* Footer: companies + source */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .card-companies {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .company-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(0, 212, 170, 0.35);
      color: var(--accent);
      font-size: 11px;
      font-weight: 500;
    }
    .card-source {
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s;
      font-family: var(--font-mono);
    }
    .card-source:hover { color: var(--accent); }

    /* ─── Empty State ─── */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .empty-state p {
      font-size: 15px;
    }
    .reset-btn {
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all 0.15s;
    }
    .reset-btn:hover {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
    }

    /* ─── Loading ─── */
    .loading {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 2;
    }
    .loading code {
      font-family: var(--font-mono);
      background: var(--border);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--accent);
    }
    /* Shared header alignment */
    .header {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(0, auto);
      align-items: start;
      gap: 12px 24px;
    }
    .header-right,
    .header-nav { justify-self: end; }
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .header { grid-template-columns: 1fr; }
      .header-right,
      .header-nav {
        justify-self: start;
        align-items: flex-start;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="header-title">
      <h1>Offshore Market Intelligence</h1>
      <span class="subtitle">Market News — Deepwater drilling, FPSO / FLNG, E&amp;P CAPEX, contracts &amp; earnings</span>
    </div>
    <div class="header-right">
      <nav class="header-nav">
        <a href="index.html" class="nav-link">Overview</a>
        <a href="pipeline.html" class="nav-link">E&amp;P Pipeline</a>
        <a href="drilling.html" class="nav-link">Deepwater Drilling</a>
        <a href="fpso.html" class="nav-link">FPSO / FLNG Assets</a>
        <a href="earnings.html" class="nav-link">Drilling Financials</a>
        <a href="fpso_earnings.html" class="nav-link">FPSO / FLNG Financials</a>
        <span class="nav-link active">Market News</span>
      </nav>
      <div class="header-meta" id="header-meta"><!-- populated by JS --></div>
    </div>
  </header>

  <div class="controls-bar">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">Sector</span>
        <div class="filter-row" id="sector-filter-row"><!-- sector buttons populated by JS --></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Category</span>
        <div class="filter-row" id="category-filter-row"><!-- category buttons populated by JS --></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
      <input class="search-input" type="text" id="search-input" placeholder="Search deepwater news, companies, projects...">
    </div>
  </div>

  <div class="news-grid" id="news-grid">
    <div class="loading">Loading news data…</div>
  </div>

</div>

<script>
(async function () {

  let newsData = null;
  let currentSector = 'All';
  let currentCategory = 'All';
  let searchQuery = '';

  function esc(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ─── Load Data ─── */
  async function loadData() {
    try {
      newsData = await fetch('./data/news.json').then(r => r.json());
    } catch (err) {
      document.getElementById('news-grid').innerHTML =
        `<div class="loading">&#9888; 데이터 로드 실패: ${esc(err.message)}<br>로컬 서버로 실행하세요: <code>python3 -m http.server 8080</code></div>`;
      return false;
    }
    return true;
  }

  /* ─── Category badge CSS class ─── */
  function catClass(category) {
    const map = { 'Contract': 'cat-Contract', 'M&A': 'cat-MA', 'Earnings': 'cat-Earnings', 'Fleet': 'cat-Fleet', 'Project': 'cat-Project', 'Outlook': 'cat-Outlook' };
    return map[category] || 'cat-Outlook';
  }

  function sectorClass(sector) {
    if (sector === 'FPSO/FLNG') return 'sector-FPSOFLNG';
    if (sector === 'E&P/CAPEX') return 'sector-EPCAPEX';
    return 'sector-Drilling';
  }

  /* ─── Render Cards ─── */
  function renderCards(items) {
    const grid = document.getElementById('news-grid');

    if (items.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <p>검색 결과가 없습니다</p>
          <button class="reset-btn" id="reset-btn">필터 초기화</button>
        </div>`;
      const resetBtn = document.getElementById('reset-btn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          currentCategory = 'All';
          currentSector = 'All';
          searchQuery = '';
          document.getElementById('search-input').value = '';
          renderSectorFilters();
          renderCategoryFilters();
          filterAndRender();
        });
      }
      return;
    }

    grid.innerHTML = items.map(item => {
      const companies = item.companies.length
        ? item.companies.map(c => `<span class="company-pill">${esc(c)}</span>`).join('')
        : '';

      return `
        <div class="news-card" data-id="${item.id}">
          <div class="card-top">
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <span class="sector-badge ${sectorClass(item.sector)}">${esc(item.sector || 'Market')}</span>
              <span class="cat-badge ${catClass(item.category)}">${esc(item.category)}</span>
            </div>
            <span class="card-date">${esc(item.date)}</span>
          </div>
          <div class="card-title">${esc(item.title)}</div>
          <div class="card-summary truncated" data-full="${esc(item.summary)}">${esc(item.summary)}</div>
          <div class="card-toggle">&#9660; more</div>
          <div class="card-footer">
            <div class="card-companies">${companies}</div>
            <a class="card-source" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.source)} &#8594;</a>
          </div>
        </div>`;
    }).join('');

    /* Card click — expand/collapse summary */
    grid.querySelectorAll('.news-card').forEach(card => {
      card.addEventListener('click', e => {
        /* Don't toggle when clicking the source link */
        if (e.target.closest('.card-source')) return;

        const summary = card.querySelector('.card-summary');
        const toggle  = card.querySelector('.card-toggle');
        const isExpanded = !summary.classList.contains('truncated');

        if (isExpanded) {
          summary.classList.add('truncated');
          toggle.innerHTML = '&#9660; more';
        } else {
          summary.classList.remove('truncated');
          toggle.innerHTML = '&#9650; less';
        }
      });
    });
  }

  /* ─── Filter & Render ─── */
  function filterAndRender() {
    let filtered = newsData.items;

    if (currentSector !== 'All') {
      filtered = filtered.filter(n => n.sector === currentSector);
    }

    if (currentCategory !== 'All') {
      filtered = filtered.filter(n => n.category === currentCategory);
    }

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(n =>
        n.title.toLowerCase().includes(q) ||
        n.summary.toLowerCase().includes(q) ||
        (n.sector || '').toLowerCase().includes(q) ||
        n.companies.some(c => c.toLowerCase().includes(q))
      );
    }

    renderCards(filtered);
  }

  /* ─── Count per category ─── */
  function countBySector(sector) {
    if (sector === 'All') return newsData.items.length;
    return newsData.items.filter(n => n.sector === sector).length;
  }

  function sectorFilteredItems() {
    return currentSector === 'All'
      ? newsData.items
      : newsData.items.filter(n => n.sector === currentSector);
  }

  function countByCategory(category) {
    const base = sectorFilteredItems();
    if (category === 'All') return base.length;
    return base.filter(n => n.category === category).length;
  }

  function buildFilterButtons(targetId, items, activeValue, dataName, countFn) {
    const row = document.getElementById(targetId);
    row.innerHTML = items.map(item => {
      const count = countFn(item);
      const label = `${esc(item)} <span class="count">(${count})</span>`;
      return `<button class="filter-btn${item === activeValue ? ' active' : ''}" data-${dataName}="${esc(item)}">${label}</button>`;
    }).join('');
    return row;
  }

  function renderCategoryFilters() {
    const categories = ['All', 'Contract', 'Project', 'M&A', 'Earnings', 'Fleet', 'Outlook'];
    const row = buildFilterButtons('category-filter-row', categories, currentCategory, 'category', countByCategory);
    row.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCategory = btn.dataset.category;
        renderCategoryFilters();
        filterAndRender();
      });
    });
  }

  function renderSectorFilters() {
    const sectors = ['All', 'Drilling', 'FPSO/FLNG', 'E&P/CAPEX'];
    const row = buildFilterButtons('sector-filter-row', sectors, currentSector, 'sector', countBySector);
    row.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentSector = btn.dataset.sector;
        if (countByCategory(currentCategory) === 0) currentCategory = 'All';
        renderSectorFilters();
        renderCategoryFilters();
        filterAndRender();
      });
    });
  }

  /* ─── Init Controls ─── */
  function initControls() {
    renderSectorFilters();
    renderCategoryFilters();

    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      filterAndRender();
    });
  }

  /* ─── Render Header Meta ─── */
  function renderHeaderMeta() {
    document.getElementById('header-meta').innerHTML = `
      <span class="live-dot"></span>
      <span>Updated:</span>
      <span class="value">${esc(newsData.updated)}</span>
    `;
  }

  /* ─── Main ─── */
  const ok = await loadData();
  if (!ok) return;

  renderHeaderMeta();
  initControls();
  filterAndRender();

})();
</script>
</body>
</html>
